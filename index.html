<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arma el Robot - Juego Educativo</title>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --background: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p.instructions {
            color: #94a3b8;
            font-size: 1rem;
        }

        .game-container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pieces-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 250px;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 2px dashed #334155;
        }

        .pieces-sidebar h3 {
            font-size: 1.1rem;
            color: var(--secondary);
            margin-bottom: 5px;
            text-align: center;
        }

        .piece {
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: grab;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
            user-select: none;
        }

        .piece:active {
            cursor: grabbing;
        }

        .piece:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #4338ca, var(--primary));
        }

        .piece.dragging {
            opacity: 0.4;
        }

        .board-container {
            position: relative;
            width: 450px;
            height: 450px;
            background: #111827;
            border-radius: 12px;
            border: 3px solid #374151;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .dropzone {
            background: #1f2937;
            border: 2px dashed #4b5563;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            transition: background 0.3s, border-color 0.3s;
            position: relative;
        }

        .dropzone span {
            font-size: 0.8rem;
            color: #6b7280;
            pointer-events: none;
        }

        .dropzone.drag-over {
            background: rgba(6, 182, 212, 0.1);
            border-color: var(--secondary);
        }

        .dropzone.correct {
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid var(--accent);
        }

        .dropzone.correct span {
            color: var(--accent);
        }

        /* Modal de victoria */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 25px rgba(0,0,0,0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .modal-content p {
            color: #cbd5e1;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .btn-restart {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-restart:hover {
            background: #16a34a;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            .board-container {
                width: 100%;
                max-width: 350px;
                height: 350px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Arma el Robot</h1>
        <p class="instructions">Arrastra cada parte del robot a su lugar correcto en el tablero.</p>
    </header>

    <div class="game-container">
        <!-- Panel de piezas desordenadas -->
        <div class="pieces-sidebar" id="sidebar">
            <h3>Componentes</h3>
            <!-- Las piezas se generan dinámicamente o por JS -->
        </div>

        <!-- Tablero de casillas -->
        <div class="board-container" id="board">
            <!-- Las zonas de destino se generan por JS -->
        </div>
    </div>

    <!-- Modal de felicitaciones -->
    <div class="modal" id="victoryModal">
        <div class="modal-content">
            <h2>¡Excelente Trabajo! 🎉</h2>
            <p>Has ensamblado el robot correctamente. ¡Eres un gran ingeniero o ingeniera!</p>
            <button class="btn-restart" onclick="resetGame()">Jugar de Nuevo</button>
        </div>
    </div>

    <script>
        const partsData = [
            { id: 'antenas', name: 'Antenas', slot: 1 },
            { id: 'cabeza', name: 'Cabeza', slot: 2 },
            { id: 'ojos', name: 'Ojos LED', slot: 3 },
            { id: 'brazo-izq', name: 'Brazo Izquierdo', slot: 4 },
            { id: 'pecho', name: 'Núcleo / Pecho', slot: 5 },
            { id: 'brazo-der', name: 'Brazo Derecho', slot: 6 },
            { id: 'pierna-izq', name: 'Pierna Izquierda', slot: 7 },
            { id: 'bateria', name: 'Batería Central', slot: 8 },
            { id: 'pierna-der', name: 'Pierna Derecha', slot: 9 }
        ];

        const sidebar = document.getElementById('sidebar');
        const board = document.getElementById('board');
        const victoryModal = document.getElementById('victoryModal');

        let correctCount = 0;

        function initGame() {
            sidebar.innerHTML = '<h3>Componentes</h3>';
            board.innerHTML = '';
            correctCount = 0;
            victoryModal.classList.remove('show');

            // Crear ranuras (slots) en el tablero ordenadas del 1 al 9
            for (let i = 1; i <= 9; i++) {
                const zone = document.createElement('div');
                zone.classList.add('dropzone');
                zone.dataset.slot = i;
                
                const expectedPart = partsData.find(p => p.slot === i);
                zone.innerHTML = `<span>${expectedPart.name}</span>`;

                zone.addEventListener('dragover', dragOver);
                zone.addEventListener('dragleave', dragLeave);
                zone.addEventListener('drop', dropPiece);

                board.appendChild(zone);
            }

            // Mezclar piezas aleatoriamente para el panel lateral
            const shuffledParts = [...partsData].sort(() => Math.random() - 0.5);

            shuffledParts.forEach(part => {
                const piece = document.createElement('div');
                piece.classList.add('piece');
                piece.draggable = true;
                piece.id = part.id;
                piece.dataset.slot = part.slot;
                piece.textContent = part.name;

                piece.addEventListener('dragstart', dragStart);
                piece.addEventListener('dragend', dragEnd);

                sidebar.appendChild(piece);
            });
        }

        let draggedPiece = null;

        function dragStart(e) {
            draggedPiece = this;
            setTimeout(() => this.classList.add('dragging'), 0);
        }

        function dragEnd(e) {
            this.classList.remove('dragging');
            draggedPiece = null;
        }

        function dragOver(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function dragLeave(e) {
            this.classList.remove('drag-over');
        }

        function dropPiece(e) {
            e.preventDefault();
            this.classList.remove('drag-over');

            // Si la zona ya tiene una pieza correcta, no hacer nada
            if (this.classList.contains('correct')) return;

            const targetSlot = this.dataset.slot;
            const pieceSlot = draggedPiece.dataset.slot;

            if (targetSlot === pieceSlot) {
                // Correcto
                this.innerHTML = `<strong>${draggedPiece.textContent}</strong>`;
                this.classList.add('correct');
                draggedPiece.remove();
                correctCount++;

                checkWinCondition();
            } else {
                // Efecto visual rápido de error opcional (sacudida o borde rojo)
                this.style.borderColor = '#ef4444';
                setTimeout(() => {
                    this.style.borderColor = '#4b5563';
                }, 500);
            }
        }

        function checkWinCondition() {
            if (correctCount === partsData.length) {
                setTimeout(() => {
                    victoryModal.classList.add('show');
                }, 300);
            }
        }

        function resetGame() {
            initGame();
        }

        // Iniciar al cargar la página
        initGame();
    </script>
</body>
</html>
